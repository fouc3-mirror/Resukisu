# ========================================
# 隐身形 AK3 打包（无反检测特征）
# ========================================
# 上一版直接关掉 CONFIG_IKCONFIG，虽然 /proc/config.gz 消失了，但内核二进制
# 也跟着变了，实测在 M332BF 上能过第一屏、第二屏后重启。这一版改成
# **不动任何内核配置**，只在打包前把 /proc/config.gz 里那份 .config 替换成
# 原厂内容（scripts/sanitize_ikconfig.py，原位等长重写）：
#   * 内核镜像除那段 .rodata 外逐字节相同 → 行为与原版一致
#   * /proc/config.gz 仍然存在、仍可读 → 依赖它的系统组件不会被惊动
#   * 里面不再有 CONFIG_KSU* / CONFIG_KSU_SUSFS_* / CONFIG_BBG / baseband_guard
#     以及伪造的 CONFIG_LOCALVERSION，和原厂 config 逐行一致
# ========================================

name: 隐身版 AK3 打包

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android15
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "6.6"
      sub_level:
        description: "子版本号 (6.6.118 → 118)"
        required: true
        type: string
        default: "118"
      os_patch_level:
        description: "安全补丁级别 (如 2026-01, lts)"
        required: true
        type: string
        default: "2026-01"
      build_time:
        description: "内核构建时间 (留空=当前 UTC；本机原厂为 Thu Aug 20 09:40:32 UTC 2026)"
        required: false
        type: string
        default: "Thu Aug 20 09:40:32 UTC 2026"
      kernel_localversion:
        description: "内核版本后缀 (留空=官方 -4k；本机原厂为 -g0908354dac1b-ab16143355-4k)"
        required: false
        type: string
        default: "-g0908354dac1b-ab16143355-4k"
      use_zram:
        description: "启用 ZRAM 增强算法 (LZ4KD)"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "加载 BBG 防格机（会注册 baseband_guard LSM；关掉更干净但未验证）"
        required: false
        type: boolean
        default: true
      revision:
        description: "修订版本 (如 r11，仅 Android 12 - 5.10 需要)"
        required: false
        type: string
        default: ""
      boot_security_patch:
        description: "boot 分区 AVB 属性 com.android.build.boot.security_patch（须与系统 ro.build.version.security_patch 一致；本机 2026-10-01，对应检测项 26）"
        required: false
        type: string
        default: "2026-10-01"
      use_kvm:
        description: "编译 KVM 支持（本机 Gunyah 在 EL1、pKVM 需要 EL2，实际用不了，可关）"
        required: false
        type: boolean
        default: true

jobs:
  # ==================== 预检 ====================
  preflight:
    name: "预检 ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
    runs-on: ubuntu-latest
    steps:
      - name: 校验 ACK 分支
        run: |
          BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "检查 android.googlesource.com/kernel/common 分支: $BRANCH"
          if git ls-remote --exit-code --heads \
              https://android.googlesource.com/kernel/common "$BRANCH" >/dev/null 2>&1; then
            echo "分支存在: $BRANCH"
          else
            echo "::error::ACK 分支不存在: $BRANCH ，请检查 android_version / kernel_version / os_patch_level"
            exit 1
          fi

  # ==================== 编译内核 ====================
  build:
    name: "隐身形 ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
    needs: preflight
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision }}
      build_time: ${{ inputs.build_time }}
      kernel_localversion: ${{ inputs.kernel_localversion }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kvm: ${{ inputs.use_kvm }}
      boot_os_version: ""
      boot_security_patch: ${{ inputs.boot_security_patch }}
      enable_susfs: true
      supp_op: false
      # ===== 反检测：不改任何内核配置，只把 /proc/config.gz 的内容换成原厂 config =====
      sanitize_config: true

  # ==================== 打包并与原厂特征比对 ====================
  package:
    name: "打包 AK3"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: 'KernelSU_kernel-*'
          path: ./artifacts
          merge-multiple: true

      - name: 筛选 AK3 包与 boot.img
        run: |
          mkdir -p out
          find ./artifacts -type f -name '*AnyKernel3.zip' -exec cp -v {} ./out/ \;
          find ./artifacts -type f -name '*boot.img' -exec cp -v {} ./out/ \;
          COUNT=$(find ./out -type f -name '*.zip' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有找到 AnyKernel3 压缩包，构建可能未生成 Image"
            exit 1
          fi
          ls -l ./out

      - name: 反检测特征自检
        run: |
          BOOT=$(find ./out -type f -name '*boot.img' | head -n1)
          if [ -z "$BOOT" ]; then
            echo "::error::未找到 boot.img，无法自检"
            exit 1
          fi
          echo "检查文件: $BOOT"

          fail=0
          check_absent() {
            if grep -aq "$1" "$BOOT"; then
              echo "::error::内核镜像里仍然存在特征: $1"
              fail=1
            else
              echo "OK: 未发现 $1"
            fi
          }
          # 用户态能直接读到的特征
          if [ "${{ inputs.use_bbg }}" = "false" ]; then
            check_absent 'baseband_guard'  # /sys/kernel/security/lsm 里的 LSM 名
            check_absent 'vc-teahouse'     # BBG 的上游地址
          else
            echo "INFO: BBG 已开启，baseband_guard / vc-teahouse 会出现在镜像与 LSM 列表里"
          fi

          # /proc/config.gz 仍然存在（CONFIG_IKCONFIG=y），但内容必须已经是原厂 config
          python3 -c 'import gzip,sys; d=open(sys.argv[1],"rb").read(); st=d.find(b"IKCFG_ST"); ed=d.find(b"IKCFG_ED",st); assert st>0 and ed>st, "IKCFG 段缺失"; t=gzip.decompress(d[st+8:ed]).decode(); bad=[k for k in ("CONFIG_KSU","CONFIG_BBG","baseband_guard") if k in t]; assert not bad, "config.gz 仍含: %s" % bad; print("OK: /proc/config.gz 干净，%d 行" % (t.count("\n")+1)); [print("   ", l) for l in t.splitlines() if l.startswith(("CONFIG_LOCALVERSION=","CONFIG_LSM=","CONFIG_LTO_NONE","CONFIG_IKCONFIG="))]' "$BOOT"

          # 下面这些只存在于镜像 .rodata，普通 App 读不到（要 root + kallsyms/BTF），
          # 而 "KernelSU" 字符串本身就无法抹除，所以只统计不拦截。
          for s in CONFIG_KSU KernelSU susfs; do
            n=$(grep -ao "$s" "$BOOT" | wc -l)
            echo "INFO: '$s' 在镜像中出现 $n 次（仅 rodata，非运行时暴露）"
          done

          echo "---- 内核版本串 ----"
          grep -ao 'Linux version 6\.[0-9.]*-android1[0-9]-[0-9]*-[^ )]*' "$BOOT" | head -n1 || true
          echo "---- UTS 版本 ----"
          grep -ao '#1 SMP PREEMPT [A-Z][a-z][a-z] [A-Z][a-z][a-z] [ 0-9][0-9] [0-9:]* UTC [0-9]*' "$BOOT" | head -n1 || true

          [ "$fail" -eq 0 ] || exit 1

      # KeyMint 版本绑定：证书里的 bootPatchLevel 来自 boot 分区的 AVB 属性，
      # 缺了就会被检测器判成 "Tampered Attestation Key(26)"。
      - name: 校验 boot.img 的 KeyMint 版本绑定属性
        run: |
          BOOT=$(find ./out -type f -name '*boot.img' | head -n1)
          python3 - "$BOOT" "${{ inputs.boot_security_patch }}" <<'PY'
          import struct, sys

          path, want_spl = sys.argv[1], sys.argv[2]
          KEYS = ("com.android.build.boot.os_version",
                  "com.android.build.boot.security_patch")
          d = open(path, "rb").read()
          tail = d[-64:]
          assert tail[:4] == b"AVBf", "没有 AVB footer"
          off, size = struct.unpack(">QQ", tail[12:28])
          vb = d[off:off + size]
          auth = struct.unpack(">I", vb[12:16])[0]
          aux = struct.unpack(">I", vb[16:20])[0]
          desc = vb[256 + auth + aux:]
          strs, cur = [], b""
          for ch in desc:
              if ch == 0:
                  if cur:
                      strs.append(cur.decode("latin1"))
                  cur = b""
              else:
                  cur += bytes([ch])
          props = {}
          for i, s in enumerate(strs):
              for k in KEYS:
                  if s.endswith(k) and i + 1 < len(strs):
                      props[k] = strs[i + 1]
          print("AVB 属性:", props)
          missing = [k for k in KEYS if not props.get(k)]
          if missing:
              print("::error::boot.img 缺少 AVB 属性: %s" % ", ".join(missing))
              sys.exit(1)
          print("security_patch = %s（系统侧应为 %s）"
                % (props[KEYS[1]], want_spl))
          print("OK: KeyMint 版本绑定属性齐全")
          PY

      - name: 上传 AK3 包
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-AK3-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}
          path: ./out/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: 上传 boot.img
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-boot-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}
          path: ./out/*boot.img
          if-no-files-found: error
          compression-level: 0

      - name: 摘要
        run: |
          {
            echo "## 隐身版 AK3 打包完成"
            echo ""
            echo "- Android: ${{ inputs.android_version }}"
            echo "- 内核: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
            echo "- 补丁级别: ${{ inputs.os_patch_level }}"
            echo "- 版本串: \`${{ inputs.kernel_localversion }}\`"
            echo "- 构建时间: \`${{ inputs.build_time }}\`"
            echo "- SUSFS: 已启用"
            echo "- /proc/config.gz: 仍存在，但内容已换成原厂 config（不含 CONFIG_KSU* / CONFIG_BBG）"
            echo "- BBG: ${{ inputs.use_bbg }}"
            echo "- 内核配置: 未改动（IKCONFIG=y / LTO / SUSFS 日志均与原厂一致）"
            echo "- boot 分区安全补丁属性: os_version=\`${{ inputs.android_version }}\` / security_patch=\`${{ inputs.boot_security_patch }}\`（KeyMint 版本绑定，对应检测项 26）"
            echo "- KPM: 未集成"
            echo ""
            echo "下载 artifact: \`Stealth-AK3-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}\`、\`Stealth-boot-...\`"
          } >> $GITHUB_STEP_SUMMARY
