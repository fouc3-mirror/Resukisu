name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

# 仅获取官方 KernelSU (tiann/KernelSU) 的管理器 APK 与 SUSFS 模块
on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: false
        type: string
        default: Official
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KSU_REPO: "tiann/KernelSU"
      KSU_WORKFLOW: "build-manager.yml"
      KSU_ARTIFACT: "manager"

    steps:
      - name: 安装依赖
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: git curl jq
          execute_install_scripts: true

      - name: 校验官方 KernelSU
        run: |
          if [ -n "${{ inputs.kernelsu_variant }}" ] && [ "${{ inputs.kernelsu_variant }}" != "Official" ]; then
            echo "::error::仅支持官方 KernelSU，收到: ${{ inputs.kernelsu_variant }}"
            exit 1
          fi
          echo "使用官方 KernelSU: $KSU_REPO"

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          git clone --depth=1 https://github.com/$KSU_REPO.git KernelSU

          cd KernelSU

          # 官方版本号计算规则：20000 + 提交数
          KSU_GIT_VERSION=$(git rev-list --count HEAD)
          KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KernelSU 版本号: $KSU_VERSION (commit count: $KSU_GIT_VERSION)"

          cd ..

          # 获取 SUSFS 版本号（取 GKI 分支的模块 module.prop）
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
          SUS_VERSION=$(curl -s "$INFO" | awk -F '=' '$1 == "version" { print $2 }')
          echo "SUSFS 版本号: $SUS_VERSION"

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 获取官方 KernelSU 管理器
        id: add_KSU
        continue-on-error: true
        run: |
          NUMBER=0
          DOWNLOAD_LIST=""

          echo "开始查找包含 '$KSU_ARTIFACT' 产物的构建..."
          while true; do
            echo "--------------------------------------------------"
            echo "正在检查第 ${NUMBER} 个历史构建 (0代表最新)..."

            if [ "$NUMBER" -ge 9 ]; then
              echo "查找九次仍然失败，跳出循环。"
              break
            fi

            BUILD_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$KSU_REPO/actions/workflows/$KSU_WORKFLOW/runs?status=success" |
              jq -r --argjson n "$NUMBER" '.workflow_runs[$n].id')

            echo "找到构建 ID: $BUILD_ID"

            if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
              echo "未获取到构建 ID"
              NUMBER=$((NUMBER + 1))
              continue
            fi

            ARTIFACTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$KSU_REPO/actions/runs/$BUILD_ID/artifacts")

            result=$(echo "$ARTIFACTS" | jq -r --arg name "$KSU_ARTIFACT" \
              '.artifacts[] | select(.name | contains($name)) | .name')

            if [ -z "$result" ]; then
              echo "没有找到包含 '$KSU_ARTIFACT' 的项"
              NUMBER=$((NUMBER + 1))
            else
              echo "$result"
              DOWNLOAD_LIST=$(echo "$ARTIFACTS" | jq -r --arg name "$KSU_ARTIFACT" \
                '.artifacts[] | select(.name | contains($name)) | "\(.name)\t\(.archive_download_url)"')
              break
            fi
          done

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "未获取到可用的 Manager artifact 下载地址列表。"
            exit 1
          fi

          # 下载并解压所有 Manager 产物
          echo "$DOWNLOAD_LIST" | while IFS=$'\t' read -r NAME URL; do
            SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
            ZIP_NAME="KernelSU-${SAFE_NAME}($KSU_VERSION).zip"
            echo "下载 $NAME -> $ZIP_NAME"
            curl -L -H "Authorization: token $GH_TOKEN" -o "$ZIP_NAME" "$URL"
            mkdir -p "manager-artifacts/$SAFE_NAME"
            unzip -o "$ZIP_NAME" -d "manager-artifacts/$SAFE_NAME"
            rm -rf "$ZIP_NAME"
          done

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
          jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')

          NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "SUSFS_NAME=$NAME" >> $GITHUB_ENV
          NAME="susfs-$NAME.zip"

          echo $DOWNLOAD_URL
          echo $NAME
          # 下载 Manager 文件
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$NAME" "$DOWNLOAD_URL"
          echo "$NAME 文件已下载"

          # 解压 artifact zip 获取里面的模块文件
          mkdir -p susfs-module
          unzip "$NAME" -d susfs-temp

          # 检查解压后的内容：如果是散装文件则打包成 zip
          cd susfs-temp
          if ls *.zip 1>/dev/null 2>&1; then
            # 里面已经是 zip 文件，直接移动
            mv *.zip ../susfs-module/
          else
            # 是散装文件，打包成 zip
            zip -r "../susfs-module/ksu_module_susfs.zip" .
          fi
          cd ..
          rm -rf susfs-temp "$NAME"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载官方 KernelSU CI 构建的管理器失败!"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager(${{ env.KSU_VERSION }})
          path: |
            **/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
